<script>
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}),KEY='bellevue-v412-iphone',LEGACY_KEY='bellevue-v411-iphone',OLD_KEY='bellevue-v41-iphone',uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const colors=['#1463ff','#18c29c','#ffb020','#ef476f','#7c3aed','#64748b','#06b6d4','#f97316','#84cc16','#ec4899'];
const seed={settings:{name:'9 Passage Bellevue',address:'9 Passage Bellevue, 74000 Annecy',bank:'Banque de Savoie',year:'2027',bankAmount:4811.10,savingsAmount:1372.02,worksFund:1188.31,worksProvision:1500},owners:[{id:'O1',name:'GALLOIS ou GUIFFIER Teddy ou Fanny',tantiemes:356},{id:'O2',name:'SCI LCT IMMO',tantiemes:295},{id:'O3',name:'PAREL Emmanuelle',tantiemes:349}],lots:[{id:'L6',n:'6',type:'Appartement',owner:'O1',t:288},{id:'L10',n:'10',type:'Garage',owner:'O1',t:47},{id:'L12',n:'12',type:'Garage',owner:'O1',t:21},{id:'L7',n:'7',type:'Appartement',owner:'O2',t:279},{id:'L8',n:'8',type:'Cave',owner:'O2',t:12},{id:'L13',n:'13',type:'Parking',owner:'O2',t:4},{id:'L1',n:'1',type:'Garage',owner:'O3',t:27},{id:'L2',n:'2',type:'Cave',owner:'O3',t:13},{id:'L3',n:'3',type:'Appartement',owner:'O3',t:288},{id:'L11',n:'11',type:'Garage',owner:'O3',t:21}],budget:[{id:uid(),cat:'Charges générales',label:'Électricité',amount:180},{id:uid(),cat:'Charges générales',label:'Entretien et petites réparations',amount:1500},{id:uid(),cat:'Charges spéciales BAT A',label:'Eau',amount:450},{id:uid(),cat:'Charges spéciales BAT A',label:'Électricité',amount:7000},{id:uid(),cat:'Assurance',label:'AXA Multirisque immeuble',amount:1400.40}],entries:[{id:uid(),date:'2026-12-31',type:'recette',cat:'Solde initial',label:'Solde Banque de Savoie repris',amount:4811.10,status:'Validé'},{id:uid(),date:'2026-12-31',type:'recette',cat:'Solde initial',label:'Solde Livret A repris',amount:1372.02,status:'Validé'},{id:uid(),date:'2026-12-31',type:'recette',cat:'Fonds travaux',label:'Fonds travaux repris',amount:1188.31,status:'Validé'},{id:uid(),date:'2026-12-31',type:'recette',cat:'Travaux décidés',label:'Provision PPPT / DPEC / rénovation énergétique',amount:1500,status:'Validé'}],calls:[],meetings:[{id:uid(),title:'Première AG en syndic bénévole',date:'2027-01-15',status:'À préparer',agenda:['Organisation du syndic bénévole','Validation du budget','Modalités des appels de fonds'],resolutions:[]}],works:[{id:uid(),title:'PPPT / DPEC / rénovation énergétique',status:'À cadrer',budget:1500,desc:'Provision travaux décidés reprise du syndic professionnel.'}],suppliers:[{id:uid(),name:'AXA',type:'Assurance',contract:'Multirisque Immeuble 828921705',amount:1400.40,renewal:'2027-02-08'},{id:uid(),name:'Banque de Savoie',type:'Banque',contract:'Compte copropriété',amount:0,renewal:''}],incidents:[],docs:[]};
let S=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(LEGACY_KEY))||JSON.parse(localStorage.getItem(OLD_KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function totalT(){return S.owners.reduce((a,o)=>a+Number(o.tantiemes),0)}function owner(id){return (S.owners.find(o=>o.id===id)||{}).name||'Copropriété'}function ownerT(id){return Number((S.owners.find(o=>o.id===id)||{}).tantiemes||0)}function share(id,a){return Math.round(Number(a||0)*ownerT(id)/totalT()*100)/100}function cash(){return S.entries.reduce((a,e)=>a+(e.type==='depense'?-Number(e.amount||0):Number(e.amount||0)),0)}function spent(){return S.entries.filter(e=>e.type==='depense').reduce((a,e)=>a+Number(e.amount||0),0)}function income(){return S.entries.filter(e=>e.type==='recette').reduce((a,e)=>a+Number(e.amount||0),0)}function budget(){return S.budget.reduce((a,b)=>a+Number(b.amount||0),0)}function pill(s){let c=['Validé','Payé','Clos','Envoyé'].includes(s)?'ok':['À préparer','À cadrer','À relancer','Préparé'].includes(s)?'warn':['Impayé','En retard'].includes(s)?'ko':'blue';return `<span class="pill ${c}">${esc(s)}</span>`}function lotsByOwner(id){return S.lots.filter(l=>l.owner===id)}function lotTypeCount(){let map={};S.lots.forEach(l=>map[l.type]=(map[l.type]||0)+1);return map}function expenseByCat(){let m={};S.entries.filter(e=>e.type==='depense').forEach(e=>{let k=e.cat||'Autres';m[k]=(m[k]||0)+Number(e.amount||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}function budgetByCat(){let m={};S.budget.forEach(b=>{let k=b.cat||'Budget';m[k]=(m[k]||0)+Number(b.amount||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function donutGradient(items,total){if(!items.length||!total)return '#edf2f7';let start=0;let parts=[];items.forEach(([k,v],i)=>{let deg=v/total*360;let end=start+deg;parts.push(`${colors[i%colors.length]} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`);start=end});return `conic-gradient(${parts.join(',')})`}function legend(items,total){return `<div class="legend">${items.map(([k,v],i)=>`<div class="legend-item"><span class="dot" style="background:${colors[i%colors.length]}"></span><span>${esc(k)}</span><b>${EUR.format(v)}</b></div>`).join('')||'<div class="empty-chart">Aucune dépense enregistrée pour l’instant.</div>'}</div>`}function hbars(items,total){return `<div class="hbar-list">${items.map(([k,v],i)=>`<div class="hbar-item"><div class="hbar-head"><span>${esc(k)}</span><b>${EUR.format(v)}</b></div><div class="hbar"><i style="width:${total?Math.max(2,v/total*100):0}%;background:${colors[i%colors.length]}"></i></div></div>`).join('')||'<div class="empty-chart">Aucune donnée à afficher.</div>'}</div>`}
function buildNav(){let n=[['home','⌂','Accueil'],['finance','€','Finances'],['calls','↗','Appels'],['ag','✓','AG'],['more','☰','Plus']];$('nav').innerHTML=n.map(x=>`<button class="nav ${x[0]=='home'?'active':''}" onclick="go('${x[0]}',this)"><b>${x[1]}</b>${x[2]}</button>`).join('');$('drawer').innerHTML=[['lots','Lots'],['works','Travaux'],['suppliers','Fournisseurs'],['incidents','Sinistres'],['docs','Documents'],['settings','Paramètres']].map(x=>`<button class="secondary" onclick="go('${x[0]}');toggle(false)">${x[1]}</button>`).join('')}function go(id,b){if(id==='more'){toggle();return}document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));if(b)b.classList.add('active');toggle(false);render()}function toggle(force){$('drawer').classList.toggle('open',force===undefined?!$('drawer').classList.contains('open'):force)}
function render(){home();finance();calls();ag();lots();works();suppliers();incidents();docs();settings()}
function home(){let pct=budget()?Math.min(100,spent()/budget()*100):0;let types=lotTypeCount();$('home').innerHTML=`<div class="grid g4"><div class="card kpi"><div class="ico">💶</div><div><div class="metric">${EUR.format(cash())}</div><div class="muted tiny">Trésorerie locale</div></div></div><div class="card kpi"><div class="ico">🏦</div><div><div class="metric">${EUR.format(S.settings.bankAmount)}</div><div class="muted tiny">Banque de Savoie</div></div></div><div class="card kpi"><div class="ico">🌱</div><div><div class="metric">${EUR.format(S.settings.worksFund)}</div><div class="muted tiny">Fonds travaux</div></div></div><div class="card kpi"><div class="ico">📊</div><div><div class="metric">${EUR.format(budget())}</div><div class="muted tiny">Budget ${S.settings.year}</div></div></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h2>Budget consommé</h2><div class="row"><span>Dépenses saisies</span><b>${EUR.format(spent())}</b></div><div class="bar" style="margin:10px 0"><i style="width:${pct}%"></i></div><div class="tiny muted">${pct.toFixed(1)} % du budget actuellement saisi.</div></div><div class="card"><h2>Appel de fonds type 1 000 €</h2><div class="list">${S.owners.map(o=>`<div class="item row"><span>${esc(o.name)}</span><b>${EUR.format(share(o.id,1000))}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><h2>Informations sur les lots</h2><div class="grid g3"><div class="item"><div class="metric" style="font-size:21px">${S.lots.length}</div><div class="tiny muted">lots au total</div></div><div class="item"><div class="metric" style="font-size:21px">${totalT()}</div><div class="tiny muted">tantièmes</div></div><div class="item"><div class="metric" style="font-size:21px">${S.owners.length}</div><div class="tiny muted">copropriétaires</div></div></div><div class="lot-metas" style="margin-top:10px">${Object.entries(types).map(([k,v])=>`<span class="tag">${v} ${esc(k)}</span>`).join('')}</div><div class="list" style="margin-top:10px">${S.owners.map(o=>`<div class="owner-block"><div class="owner-header"><div><b>${esc(o.name)}</b><div class="tiny muted">${o.tantiemes}/1000 tantièmes</div></div><span class="pill blue">${lotsByOwner(o.id).length} lots</span></div><div class="owner-lots">${lotsByOwner(o.id).map(l=>`<div class="owner-lot"><span>Lot ${esc(l.n)} - ${esc(l.type)}</span><b>${l.t}</b></div>`).join('')}</div></div>`).join('')}</div></div>`}
function finance(){let exp=expenseByCat(), expTotal=spent(), bud=budgetByCat(), budTotal=budget();$('finance').innerHTML=`<div class="card"><h2>Vue graphique des finances</h2><div class="finance-kpis"><div class="mini-kpi"><div class="tiny muted">Recettes</div><b>${EUR.format(income())}</b></div><div class="mini-kpi"><div class="tiny muted">Dépenses</div><b>${EUR.format(expTotal)}</b></div><div class="mini-kpi"><div class="tiny muted">Solde</div><b>${EUR.format(cash())}</b></div><div class="mini-kpi"><div class="tiny muted">Budget</div><b>${EUR.format(budTotal)}</b></div></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h2>Dépenses par type</h2>${exp.length?`<div class="donut-row"><div class="donut" style="background:${donutGradient(exp,expTotal)}"><div class="donut-center">Dépenses<br>${EUR.format(expTotal)}</div></div>${legend(exp,expTotal)}</div>`:'<div class="empty-chart">Aucune dépense saisie. Ajoute une dépense pour voir le graphique se remplir.</div>'}</div><div class="card"><h2>Budget prévisionnel par type</h2>${hbars(bud,budTotal)}</div></div><div class="card" style="margin-top:12px"><h2>Comptabilité simple</h2><form class="form" onsubmit="addEntry(event)"><input class="s2" type="date" name="date" value="${today()}" required><select class="s2" name="type"><option value="depense">Dépense</option><option value="recette">Recette</option></select><input class="s4" name="label" placeholder="Libellé" required><select class="s2" name="cat"><option>Assurance</option><option>Électricité</option><option>Eau</option><option>Chauffage</option><option>Entretien</option><option>Banque</option><option>Travaux</option><option>Appel de fonds</option><option>Fonds travaux</option><option>Solde initial</option><option>Autres</option></select><input class="s2" type="number" step="0.01" min="0" name="amount" placeholder="Montant" required><button class="s12">Ajouter</button></form></div><div class="card" style="margin-top:12px"><h2>Journal</h2><div class="list">${S.entries.slice().reverse().map(e=>`<div class="item"><div class="row"><div><div class="item-title">${esc(e.label)}</div><div class="tiny muted">${e.date} - ${esc(e.cat)}</div></div>${pill(e.status)}</div><div class="row" style="margin-top:8px"><span>${e.type==='depense'?'Dépense':'Recette'}</span><b>${e.type==='depense'?'- ':'+ '}${EUR.format(e.amount)}</b></div><div class="actions" style="margin-top:8px"><button class="danger small" onclick="remove('entries','${e.id}')">Supprimer</button></div></div>`).join('')}</div></div>`}function addEntry(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));S.entries.push({id:uid(),...f,amount:Number(f.amount),status:'Validé'});ev.target.reset();save();toast('Opération ajoutée')}function remove(k,id){S[k]=S[k].filter(x=>x.id!==id);save()}
function calls(){$('calls').innerHTML=`<div class="card"><h2>Appels de fonds</h2><form class="form" onsubmit="addCall(event)"><input class="s3" name="period" placeholder="Période" required><input class="s3" type="date" name="due" required><input class="s3" type="number" step="0.01" name="amount" placeholder="Montant total" required><button class="s3">Créer</button></form></div><div class="list" style="margin-top:12px">${S.calls.map(c=>`<div class="card"><div class="row"><h2>${esc(c.period)}</h2>${pill(c.status)}</div><div class="tiny muted">Échéance ${c.due}</div><div class="grid g3" style="margin-top:10px">${S.owners.map(o=>`<div class="item"><b>${esc(o.name)}</b><div class="metric" style="font-size:20px">${EUR.format(share(o.id,c.amount))}</div><div class="tiny muted">${o.tantiemes} tantièmes</div></div>`).join('')}</div><div class="actions" style="margin-top:10px"><button onclick="postCall('${c.id}')">Comptabiliser</button><button class="secondary" onclick="docCall('${c.id}')">Document</button><button class="danger" onclick="remove('calls','${c.id}')">Suppr.</button></div></div>`).join('')||'<div class="notice">Aucun appel créé.</div>'}</div>`}function addCall(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));S.calls.push({id:uid(),...f,amount:Number(f.amount),status:'Préparé'});ev.target.reset();save()}function postCall(id){let c=S.calls.find(x=>x.id===id);S.owners.forEach(o=>S.entries.push({id:uid(),date:today(),type:'recette',cat:'Appel de fonds',label:`${c.period} - ${o.name}`,amount:share(o.id,c.amount),status:'À relancer'}));c.status='Envoyé';save();toast('Appel comptabilisé')}function docCall(id){let c=S.calls.find(x=>x.id===id);addDoc('Appel de fonds '+c.period,`APPEL DE FONDS - ${c.period}\n\nCopropriété : ${S.settings.name}\nÉchéance : ${c.due}\nMontant total : ${EUR.format(c.amount)}\n\nRépartition :\n${S.owners.map(o=>`${o.name} : ${EUR.format(share(o.id,c.amount))}`).join('\n')}`,'Appels de fonds')}
function ag(){$('ag').innerHTML=`<div class="card"><h2>Assemblées générales</h2><form class="form" onsubmit="addMeeting(event)"><input class="s4" name="title" placeholder="Titre" required><input class="s3" type="date" name="date" required><textarea class="s5" name="agenda" placeholder="Ordre du jour, une ligne par point"></textarea><button class="s12">Ajouter l'AG</button></form></div><div class="list" style="margin-top:12px">${S.meetings.map(m=>`<div class="card"><div class="row"><h2>${esc(m.title)}</h2>${pill(m.status)}</div><div class="tiny muted">${m.date}</div><div class="notice">${m.agenda.map(esc).join('<br>')}</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="addResolution('${m.id}')">Résolution</button><button class="secondary" onclick="docPV('${m.id}')">PV</button><button class="danger" onclick="remove('meetings','${m.id}')">Suppr.</button></div><div class="list" style="margin-top:8px">${(m.resolutions||[]).map(r=>`<div class="item"><b>${esc(r.title)}</b></div>`).join('')}</div></div>`).join('')}</div>`}function addMeeting(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));S.meetings.push({id:uid(),title:f.title,date:f.date,status:'À préparer',agenda:String(f.agenda||'').split('\n').filter(Boolean),resolutions:[]});ev.target.reset();save()}function addResolution(id){let t=prompt('Titre de la résolution');if(!t)return;let m=S.meetings.find(x=>x.id===id);m.resolutions.push({id:uid(),title:t});save()}function docPV(id){let m=S.meetings.find(x=>x.id===id);addDoc('PV '+m.title,`PROCÈS-VERBAL - ${m.title}\n\nDate : ${m.date}\n\nOrdre du jour :\n${m.agenda.join('\n')}\n\nRésolutions :\n${(m.resolutions||[]).map(r=>'- '+r.title).join('\n')}`,'AG')}
function lots(){$('lots').innerHTML=`<div class="card"><h2>Lots et tantièmes</h2><div class="notice">Total tantièmes : <b>${totalT()}</b></div><br><div class="list">${S.lots.map(l=>`<div class="item lot-mini"><div><b>Lot ${esc(l.n)} - ${esc(l.type)}</b><div class="tiny muted">${esc(owner(l.owner))}</div></div><b>${l.t}</b></div>`).join('')}</div></div>`}function works(){$('works').innerHTML=`<div class="card"><h2>Travaux</h2><form class="form" onsubmit="addWork(event)"><input class="s4" name="title" placeholder="Travaux" required><input class="s3" type="number" step="0.01" name="budget" placeholder="Budget"><select class="s3" name="status"><option>À cadrer</option><option>Devis</option><option>Voté</option><option>En cours</option><option>Terminé</option></select><button class="s2">Ajouter</button><textarea class="s12" name="desc" placeholder="Description"></textarea></form></div><div class="list" style="margin-top:12px">${S.works.map(w=>`<div class="card"><div class="row"><h2>${esc(w.title)}</h2>${pill(w.status)}</div><p>${esc(w.desc||'')}</p><div>Budget : <b>${EUR.format(w.budget||0)}</b></div><div class="actions" style="margin-top:8px"><button class="danger small" onclick="remove('works','${w.id}')">Supprimer</button></div></div>`).join('')}</div>`}function addWork(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));S.works.push({id:uid(),...f,budget:Number(f.budget||0)});ev.target.reset();save()}function suppliers(){$('suppliers').innerHTML=`<div class="card"><h2>Fournisseurs</h2><div class="list">${S.suppliers.map(s=>`<div class="item"><div class="row"><b>${esc(s.name)}</b><span>${EUR.format(s.amount||0)}</span></div><div class="tiny muted">${esc(s.type)} - ${esc(s.contract||'')}</div></div>`).join('')}</div></div>`}function incidents(){$('incidents').innerHTML=`<div class="card"><h2>Sinistres</h2><form class="form" onsubmit="addIncident(event)"><input class="s3" type="date" name="date" value="${today()}"><input class="s5" name="title" placeholder="Sujet" required><select class="s2" name="status"><option>Ouvert</option><option>Déclaré assurance</option><option>Clos</option></select><button class="s2">Ajouter</button><textarea class="s12" name="desc" placeholder="Description"></textarea></form></div><div class="list" style="margin-top:12px">${S.incidents.map(i=>`<div class="card"><div class="row"><h2>${esc(i.title)}</h2>${pill(i.status)}</div><div class="tiny muted">${i.date}</div><p>${esc(i.desc||'')}</p></div>`).join('')||'<div class="notice">Aucun sinistre.</div>'}</div>`}function addIncident(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));S.incidents.push({id:uid(),...f});ev.target.reset();save()}function addDoc(title,content,cat){S.docs.unshift({id:uid(),date:today(),title,content,cat});save();go('docs')}function docs(){$('docs').innerHTML=`<div class="card"><h2>Documents</h2><div class="list">${S.docs.map(d=>`<div class="item"><div class="row"><div><b>${esc(d.title)}</b><div class="tiny muted">${d.date} - ${esc(d.cat)}</div></div><span class="chip">Doc</span></div><div class="doc" contenteditable="true" onblur="saveDoc('${d.id}',this.innerText)">${esc(d.content)}</div><div class="actions" style="margin-top:8px"><button class="secondary small" onclick="copyDoc('${d.id}')">Copier</button><button class="danger small" onclick="remove('docs','${d.id}')">Suppr.</button></div></div>`).join('')||'<div class="notice">Aucun document.</div>'}</div></div>`}function saveDoc(id,text){let d=S.docs.find(x=>x.id===id);d.content=text;save()}function copyDoc(id){navigator.clipboard.writeText(S.docs.find(d=>d.id===id).content);toast('Copié')}function settings(){$('settings').innerHTML=`<div class="card"><h2>Paramètres et sauvegarde</h2><div class="notice">Cette version utilise le stockage local du navigateur sur l'iPhone. Elle ne synchronise pas avec Fanny ni Google Drive. Après chaque séance utile, clique sur <b>Sauver</b> pour exporter un JSON.</div><div class="actions" style="margin-top:10px"><button onclick="exportJSON()">Exporter JSON</button><label class="chip">Importer JSON<input class="hide" type="file" accept="application/json" onchange="importJSON(event)"></label><button class="danger" onclick="resetData()">Réinitialiser</button></div></div>`}
function exportJSON(){let data={exportedAt:new Date().toISOString(),app:'9 Passage Bellevue V4.1.2 iPhone',data:S};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='9-passage-bellevue-sauvegarde-v4-1-2.json';a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde JSON générée')}function importJSON(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{S=JSON.parse(r.result).data||JSON.parse(r.result);save();toast('Sauvegarde restaurée')};r.readAsText(f)}function resetData(){if(confirm('Réinitialiser les données ?')){S=structuredClone(seed);save()}}
buildNav();render();
</script>
</body>
