<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b70">
<title>9 Passage Bellevue – Gestion copropriété V7.0</title>

<style>
:root{
 --bg:#f3f6fb;--card:#fff;--ink:#172b45;--muted:#748198;
 --blue:#155eef;--navy:#123b70;--green:#168044;
 --red:#c62828;--orange:#b65f00;--line:#e3e9f2;
 --shadow:0 5px 20px rgba(20,40,70,.06);
 --radius:17px;--safe:env(safe-area-inset-bottom)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 padding-bottom:30px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;
 background:var(--blue);color:white;font-weight:750}
button:active{transform:scale(.98)}
button.secondary{background:#eaf1ff;color:#174da9}
button.danger{background:#c62828;color:white}
button.light{background:#f1f4f9;color:#263d5b}
button.small{padding:7px 10px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);
 border-radius:11px;background:white;color:var(--ink);min-width:0}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;font-weight:650;color:#40516b}
header{
 background:linear-gradient(120deg,#123b70,#155eef);
 color:white;padding:15px 18px;position:sticky;top:0;z-index:20;
 box-shadow:0 4px 15px #123b7025
}
.head{max-width:1250px;margin:auto;display:flex;align-items:center;
 justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:45px;width:45px;border-radius:14px;background:white;
 color:#155eef;display:grid;place-items:center;font-size:23px;font-weight:950}
h1{font-size:18px;margin:0}
.head small{opacity:.8}
.head button{background:#ffffff20;color:white;border:1px solid #ffffff40}
nav{
 max-width:1250px;margin:14px auto 0;padding:0 12px;
 display:grid;grid-template-columns:repeat(5,1fr);gap:7px
}
.nav{
 background:white;color:#60718a;border:1px solid var(--line);
 padding:10px 4px;font-size:11px;display:flex;flex-direction:column;
 align-items:center;gap:4px;border-radius:12px
}
.nav span{font-size:19px}
.nav.active{background:#e9f1ff;color:#1554c1;border-color:#b8ceff}
main{max-width:1250px;margin:auto;padding:16px}
.section{display:none}
.section.active{display:block}
.page-title{display:flex;justify-content:space-between;align-items:center;
 gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-title h2{font-size:21px;margin:0}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);
 padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin:0 0 14px}
.metric{font-size:25px;font-weight:900;letter-spacing:-.5px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.kpi{display:flex;align-items:center;gap:12px}
.kpi-icon{width:44px;height:44px;display:grid;place-items:center;
 border-radius:14px;background:#edf3ff;font-size:21px;flex-shrink:0}
.kpi-label{font-size:12px;color:var(--muted);margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:7px 0}
.divider{border:0;border-top:1px solid var(--line);margin:12px 0}
.badge{display:inline-block;border-radius:50px;padding:5px 9px;
 font-size:11px;font-weight:800;background:#edf2fa;color:#52637c}
.badge.ok{background:#e6f6ec;color:#168044}
.badge.warn{background:#fff1d9;color:#a65a00}
.badge.ko{background:#ffeded;color:#c62828}
.notice{padding:12px;border-radius:12px;background:#eef5ff;
 color:#244d83;font-size:13px;line-height:1.5}
.alert{padding:12px;border-radius:12px;background:#fff3e4;
 color:#804500;font-size:13px;line-height:1.5}
.success{padding:12px;border-radius:12px;background:#e9f7ef;
 color:#17653a;font-size:13px}
.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.field{grid-column:span 4;display:grid;gap:5px}
.field.s2{grid-column:span 2}
.field.s3{grid-column:span 3}
.field.s6{grid-column:span 6}
.field.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:650px;background:white}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);
 font-size:12px;text-align:left;vertical-align:middle}
th{background:#f5f7fb;color:#52637c;font-weight:800;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.positive{color:#c62828;font-weight:850}
.negative{color:#168044;font-weight:850}
.zero{color:#667085;font-weight:850}
.progress{height:9px;background:#e9edf4;border-radius:30px;overflow:hidden}
.progress i{display:block;height:100%;background:#155eef;border-radius:30px}
.checkline{display:flex;align-items:center;gap:10px;padding:10px;
 border:1px solid var(--line);border-radius:11px;margin-bottom:7px}
.checkline span{flex:1;font-size:13px}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.search{max-width:300px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 background:#172b45;color:white;padding:12px 20px;border-radius:12px;
 z-index:100;display:none;box-shadow:var(--shadow);max-width:90%;
 text-align:center}
.hidden{display:none!important}
@media(max-width:760px){
 header{padding:12px}
 .head small{font-size:10px}
 nav{grid-template-columns:repeat(5,1fr);gap:4px;padding:0 7px}
 .nav{font-size:9px;padding:8px 2px}
 .nav span{font-size:18px}
 main{padding:11px}
 .g2,.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .metric{font-size:21px}
 .card{padding:13px}
 .field,.field.s2,.field.s3,.field.s6{grid-column:span 6}
 .field.full{grid-column:1/-1}
 .page-title h2{font-size:19px}
}
@media(max-width:420px){
 .g2,.g3,.g4{grid-template-columns:1fr}
 .field,.field.s2,.field.s3,.field.s6{grid-column:1/-1}
 .logo{width:38px;height:38px}
 h1{font-size:15px}
}
@media print{
 header,nav,.actions,button,footer{display:none!important}
 body{background:white;padding:0}
 main{max-width:none;padding:0}
 .section{display:none!important}
 .section.active{display:block!important}
 .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

<body>

<header>
 <div class="head">
  <div class="brand">
   <div class="logo">9</div>
   <div>
    <h1>9 Passage Bellevue</h1>
    <small>Gestion de copropriété · V7.0</small>
   </div>
  </div>
  <div class="actions" style="margin:0">
   <button onclick="backup()">Sauvegarder</button>
  </div>
 </div>
</header>

<nav id="nav">
 <button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>Accueil</button>
 <button class="nav" data-page="expenses" onclick="go('expenses')"><span>€</span>Charges</button>
 <button class="nav" data-page="owners" onclick="go('owners')"><span>♙</span>Copro.</button>
 <button class="nav" data-page="closing" onclick="go('closing')"><span>✓</span>Clôture</button>
 <button class="nav" data-page="more" onclick="go('more')"><span>☰</span>Plus</button>
</nav>

<main>

<section id="home" class="section active"></section>
<section id="expenses" class="section"></section>
<section id="owners" class="section"></section>
<section id="closing" class="section"></section>
<section id="more" class="section"></section>
<section id="bank" class="section"></section>
<section id="works" class="section"></section>
<section id="calls" class="section"></section>
<section id="docs" class="section"></section>
<section id="settings" class="section"></section>

</main>

<footer>9 Passage Bellevue · Gestion interne · V7.0</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* =====================================================
   1. CONFIGURATION ET OUTILS
===================================================== */

const KEY='bellevue-v70';
const OLD_KEYS=['bellevue-v61-cloture-auto','bellevue-v6-cloture','bellevue-v42-financier'];
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,11);
const today=()=>new Date().toLocaleDateString('en-CA');
const money=n=>EUR.format(Number(n)||0);
const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+Number(f(x)||0),0);

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}
function notify(msg){
 const t=$('toast');
 t.textContent=msg;
 t.style.display='block';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display='none',2600);
}
function status(s){
 const c=['Justifié','Rapproché','Réglé','Affecté','Terminé','Pointé'].includes(s)
 ?'ok':['Partiel','À affecter','Factures manquantes'].includes(s)
 ?'warn':['Non réglé','À faire'].includes(s)?'ko':'';
 return `<span class="badge ${c}">${esc(s)}</span>`;
}

/* =====================================================
   2. DONNÉES INITIALES
===================================================== */

const seed={
 meta:{version:'7.0',updated:today()},
 settings:{
  bankOpening:2097.89,bank:1476.32,bankDate:'2026-09-30',
  savings:1372.02,savingsDate:'2026-01-30',
  fundOpening:637,fundCalls:551.31,fundSpent:0,
  budget2026:14700,budget2027:9500
 },
 owners:[
  {id:'O1',name:'GALLOIS / GUIFFIER',account:'45000004',cg:356,bata:335,provisions:3891.99},
  {id:'O2',name:'SCI LCT IMMO',account:'45000005',cg:295,bata:291,provisions:3320.46},
  {id:'O3',name:'PAREL Emmanuelle',account:'45000003',cg:349,bata:328,provisions:3812.52}
 ],
 expenses:[
  ['2026-01-01','Assureur','Assurance annuelle','Assurance','CG',1400.40,'Justifié'],
  ['2026-02-09','Fournisseur fioul','Livraison 3 000 litres','Chauffage','BATA',3717.18,'Justifié'],
  ['2026-09-30','EDF','Factures janvier à septembre','Électricité','CG',157.46,'Partiel'],
  ['2026-09-30','Service des eaux','Prélèvements avril et septembre','Eau','CG',327.73,'Factures manquantes'],
  ['2026-09-30','TotalEnergies Proxi Sud Est','Maintenance janvier à septembre','Entretien courant','CG',197.98,'Partiel'],
  ['2026-07-10','IRIA Immobilier','Honoraires janvier au 10 juillet','Honoraires syndic','CG',2107.51,'Justifié'],
  ['2026-09-30','Banque','Frais bancaires identifiés','Frais bancaires','CG',26.82,'Partiel']
 ].map((x,i)=>({
  id:'E'+i,date:x[0],supplier:x[1],label:x[2],
  cat:x[3],key:x[4],amount:x[5],status:x[6]
 })),
 exceptional:[
  {id:'X1',title:'DPE collectif / PPPT',called:1500,received:1500,spent:1500,status:'Rapproché'},
  {id:'X2',title:'Acompte audit',called:450,received:289.80,spent:450,status:'Partiel'},
  {id:'X3',title:'Acompte AMO',called:900,received:579.60,spent:900,status:'Partiel'},
  {id:'X4',title:'Maîtrise d’œuvre',called:2904,received:1870.18,spent:1953.27,status:'Partiel'},
  {id:'X5',title:'Solde audit',called:0,received:0,spent:1050,status:'À affecter'}
 ],
 movements:[
  {id:'M1',ownerId:'O1',kind:'exceptional-call',label:'DPE / PPPT',amount:534,status:'Réglé'},
  {id:'M2',ownerId:'O2',kind:'exceptional-call',label:'DPE / PPPT',amount:442.50,status:'Réglé'},
  {id:'M3',ownerId:'O3',kind:'exceptional-call',label:'DPE / PPPT',amount:523.50,status:'Réglé'},
  {id:'M4',ownerId:'O1',kind:'exceptional-call',label:'Études AF-2026-01',amount:1514.42,status:'Non réglé'},
  {id:'M5',ownerId:'O2',kind:'exceptional-call',label:'Études AF-2026-01',amount:1254.93,status:'Réglé'},
  {id:'M6',ownerId:'O3',kind:'exceptional-call',label:'Études AF-2026-01',amount:1484.65,status:'Réglé'},
  {id:'M7',ownerId:'O3',kind:'current-payment',label:'Règlement appel courant antérieur',amount:1334.47,status:'Affecté'}
 ],
 bankTx:[],
 checklist:[
  'Relevés octobre à décembre',
  'Historique annuel Livret A et intérêts',
  'Balances IRIA',
  'Factures d’eau',
  'Factures maintenance chaudière',
  'EDF octobre à décembre',
  'Vérifier nouvelle livraison de fioul',
  'Charges 2026 reçues début 2027',
  'Rapprochement bancaire définitif',
  'Annexes comptables AG'
 ].map((x,i)=>({id:'C'+i,title:x,done:false})),
 docs:[]
};

/* =====================================================
   3. CHARGEMENT ET SAUVEGARDE
===================================================== */

function normalize(data){
 const d=structuredClone(seed);
 if(!data||typeof data!=='object')return d;

 for(const k of ['owners','expenses','exceptional','movements','bankTx','checklist','docs']){
  if(Array.isArray(data[k]))d[k]=data[k];
 }
 d.settings={...d.settings,...(data.settings||{})};
 d.meta={...d.meta,...(data.meta||{}),version:'7.0'};
 return d;
}

function load(){
 try{
  const saved=localStorage.getItem(KEY);
  if(saved)return normalize(JSON.parse(saved));

  for(const k of OLD_KEYS){
   const raw=localStorage.getItem(k);
   if(raw){
    const old=JSON.parse(raw);
    const d=old.data||old;
    return normalize(d);
   }
  }
 }catch(e){
  console.error(e);
 }
 return structuredClone(seed);
}

let S=load();
let expenseFilter='all';
let expenseSearch='';

function save(message='Modifications enregistrées'){
 try{
  S.meta.updated=today();
  localStorage.setItem(KEY,JSON.stringify(S));
  render();
  notify(message);
 }catch(e){
  notify('Erreur de sauvegarde : espace de stockage insuffisant.');
  console.error(e);
 }
}

/* =====================================================
   4. CALCULS
===================================================== */

function currentTotal(){return sum(S.expenses,x=>x.amount)}
function cgTotal(){return sum(S.expenses,x=>x.key==='CG'?x.amount:0)}
function batTotal(){return sum(S.expenses,x=>x.key==='BATA'?x.amount:0)}
function fundTotal(){
 return round(Number(S.settings.fundOpening)+Number(S.settings.fundCalls)-Number(S.settings.fundSpent));
}
function owner(id){return S.owners.find(x=>x.id===id)}

function calcClose(){
 return S.owners.map(o=>{
  const qcg=round(cgTotal()*o.cg/1000);
  const qbat=round(batTotal()*o.bata/954);
  const real=round(qcg+qbat);
  return {...o,qcg,qbat,real,reg:round(real-o.provisions)};
 });
}

function bankSigned(t){
 return t.direction==='credit'?Number(t.amount):-Number(t.amount);
}
function bankCalculated(){
 return round(Number(S.settings.bankOpening)+sum(S.bankTx,bankSigned));
}
function bankDifference(){
 return round(Number(S.settings.bank)-bankCalculated());
}

/* =====================================================
   5. NAVIGATION
===================================================== */

function go(id){
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active');

 const nav=document.querySelector(`[data-page="${id}"]`);
 if(nav)nav.classList.add('active');

 if(id==='more')document.querySelector('[data-page="more"]').classList.add('active');
 render();
 window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
 home();
 expenses();
 owners();
 closing();
 more();
 bank();
 works();
 calls();
 docs();
 settings();
}

/* =====================================================
   6. TABLEAU DE BORD
===================================================== */

function home(){
 const c=calcClose();
 const reg=sum(c,x=>x.reg);
 const done=S.checklist.filter(x=>x.done).length;
 const total=S.checklist.length;
 const diff=bankDifference();

 $('home').innerHTML=`
 <div class="page-title">
  <h2>Tableau de bord</h2>
  <span class="badge">Exercice 2026</span>
 </div>

 <div class="grid g4">
  <div class="card kpi">
   <div class="kpi-icon">🏦</div>
   <div><div class="metric">${money(S.settings.bank)}</div><div class="kpi-label">Compte courant</div></div>
  </div>
  <div class="card kpi">
   <div class="kpi-icon">💰</div>
   <div><div class="metric">${money(S.settings.savings)}</div><div class="kpi-label">Livret A</div></div>
  </div>
  <div class="card kpi">
   <div class="kpi-icon">🧾</div>
   <div><div class="metric">${money(currentTotal())}</div><div class="kpi-label">Charges documentées</div></div>
  </div>
  <div class="card kpi">
   <div class="kpi-icon">⚖️</div>
   <div><div class="metric">${money(reg)}</div><div class="kpi-label">Régularisation provisoire</div></div>
  </div>
 </div>

 <div class="grid g2" style="margin-top:14px">
  <div class="card">
   <h3>Répartition des charges</h3>
   <div class="row"><span>Charges générales</span><b>${money(cgTotal())}</b></div>
   <div class="row"><span>Charges BAT A</span><b>${money(batTotal())}</b></div>
   <hr class="divider">
   <div class="row"><b>Total documenté</b><b>${money(currentTotal())}</b></div>
   <div class="notice" style="margin-top:10px">Les charges sont réparties selon les clés CG 1 000 et BAT A 954 enregistrées dans les paramètres de copropriété.</div>
   <div class="actions"><button onclick="go('expenses')">Gérer les charges</button></div>
  </div>

  <div class="card">
   <h3>Suivi de clôture</h3>
   <div class="row"><span>Checklist complétée</span><b>${done}/${total}</b></div>
   <div class="progress"><i style="width:${total?done/total*100:0}%"></i></div>
   <div class="row" style="margin-top:12px"><span>Fonds travaux</span><b>${money(fundTotal())}</b></div>
   <div class="row"><span>Écart bancaire</span><b class="${Math.abs(diff)<.005?'negative':'positive'}">${money(diff)}</b></div>
   <div class="actions"><button onclick="go('closing')">Suivre la clôture</button></div>
  </div>
 </div>

 <div class="card" style="margin-top:14px">
  <h3>Situation des copropriétaires</h3>
  <div class="table-wrap"><table>
   <thead><tr><th>Copropriétaire</th><th class="num">Charges réelles</th><th class="num">Provisions</th><th class="num">Solde</th></tr></thead>
   <tbody>${c.map(o=>`
    <tr><td><b>${esc(o.name)}</b></td>
    <td class="num">${money(o.real)}</td>
    <td class="num">${money(o.provisions)}</td>
    <td class="num ${o.reg>0?'positive':o.reg<0?'negative':'zero'}">${money(o.reg)}</td></tr>
   `).join('')}</tbody>
  </table></div>
 </div>

 <div class="alert" style="margin-top:14px">
  <b>Attention :</b> les montants de clôture sont provisoires tant que toutes les factures, les relevés bancaires et les pièces justificatives n'ont pas été vérifiés.
 </div>`;
}

/* =====================================================
   7. CHARGES
===================================================== */

function expenses(){
 const filtered=S.expenses.filter(e=>{
  const match=expenseSearch.toLowerCase();
  const text=[e.supplier,e.label,e.cat,e.date].join(' ').toLowerCase();
  return (!match||text.includes(match))&&
   (expenseFilter==='all'||e.key===expenseFilter);
 });

 $('expenses').innerHTML=`
 <div class="page-title"><h2>Gestion des charges</h2><span class="badge">${S.expenses.length} opérations</span></div>

 <div class="card">
  <h3>Ajouter une charge</h3>
  <form class="form" onsubmit="addExpense(event)">
   <div class="field s3"><label>Date</label><input type="date" name="date" value="${today()}" required></div>
   <div class="field s3"><label>Fournisseur</label><input name="supplier" placeholder="Nom du fournisseur" required></div>
   <div class="field s6"><label>Libellé</label><input name="label" placeholder="Description de la dépense" required></div>
   <div class="field s3"><label>Catégorie</label>
    <select name="cat">
     ${['Assurance','Chauffage','Eau','Électricité','Entretien courant','Frais bancaires','Honoraires syndic','Autres charges'].map(x=>`<option>${x}</option>`).join('')}
    </select>
   </div>
   <div class="field s3"><label>Clé de répartition</label>
    <select name="key"><option value="CG">Générale 1 000</option><option value="BATA">BAT A 954</option></select>
   </div>
   <div class="field s3"><label>Montant TTC (€)</label><input type="number" name="amount" min="0.01" step="0.01" placeholder="0,00" required></div>
   <div class="field s3"><label>Justificatif</label>
    <select name="status"><option>Justifié</option><option>Partiel</option><option>Factures manquantes</option></select>
   </div>
   <div class="field full"><button type="submit">＋ Ajouter la charge</button></div>
  </form>
 </div>

 <div class="card" style="margin-top:14px">
  <div class="page-title">
   <h3 style="margin:0">Historique des charges</h3>

  </div>
  <hr class="divider">
  <div class="tiny muted">Version : 7.0 · Dernière sauvegarde : ${esc(S.meta.updated||'Non renseignée')}</div>
 </div>`;
}

function saveSettings(e){
 e.preventDefault();
 const f=Object.fromEntries(new FormData(e.target));
 const keys=['bankOpening','bank','savings','fundOpening','fundCalls','fundSpent','budget2026','budget2027'];
 for(const k of keys){
  const v=Number(f[k]);
  if(!Number.isFinite(v))return notify('Valeur numérique incorrecte.');
  S.settings[k]=v;
 }
 S.settings.bankDate=f.bankDate;
 S.settings.savingsDate=f.savingsDate;
 save('Paramètres enregistrés');
}

/* =====================================================
   16. EXPORTS ET IMPORTS
===================================================== */

function download(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadCSV(rows,name){
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 download(new Blob([csv],{type:'text/csv;charset=utf-8'}),name);
 notify('Fichier CSV préparé');
}

function exportAllCSV(){
 downloadCSV([
  ['Date','Fournisseur','Libellé','Catégorie','Clé','Montant','Statut'],
  ...S.expenses.map(x=>[x.date,x.supplier,x.label,x.cat,x.key,x.amount,x.status])
 ],'charges-9-passage-bellevue.csv');
}

function backup(){
 const data={
  app:'9 Passage Bellevue',
  version:'7.0',
  exportedAt:new Date().toISOString(),
  data:S
 };
 download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),
  'bellevue-sauvegarde-'+today()+'.json');
 notify('Sauvegarde téléchargée');
}

function restore(e){
 const file=e.target.files?.[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const x=JSON.parse(reader.result);
   const data=x.data||x;
   if(!data||typeof data!=='object'||!Array.isArray(data.owners)||!Array.isArray(data.expenses)){
    throw new Error('Structure incorrecte');
   }
   if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;
   S=normalize(data);
   save('Sauvegarde restaurée');
  }catch(err){
   notify('Fichier invalide ou incompatible.');
   console.error(err);
  }
 };
 reader.readAsText(file);
 e.target.value='';
}

function resetData(){
 if(!confirm('ATTENTION : toutes les données locales seront remplacées par les données initiales. As-tu téléchargé une sauvegarde ?'))return;
 if(!confirm('Confirmer définitivement la réinitialisation ?'))return;
 S=structuredClone(seed);
 save('Données réinitialisées');
 go('home');
}

/* =====================================================
   17. DÉMARRAGE
===================================================== */

render();
</script>
