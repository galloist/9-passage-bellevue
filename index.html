y:none;grid-template-columns:repeat(2,1fr);gap:7px}.drawer.open{display:grid}.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + var(--safe));z-index:50;background:#101828;color:white;border-radius:14px;padding:11px;display:none}.hide{display:none}.check{display:grid;grid-template-columns:24px 1fr auto;gap:8px}.check input{width:18px;height:18px}.result-positive{color:var(--red);font-weight:900}.result-negative{color:var(--green);font-weight:900}.result-zero{color:var(--muted);font-weight:900}

<script>'use strict';
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}),KEY='bellevue-v61-cloture-auto',V6='bellevue-v6-cloture',V42='bellevue-v42-financier';const $=x=>document.getElementById(x),uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+Number(f(x)||0),0),round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const seed={meta:{version:'6.2',updated:'2026-10-14'},settings:{bankOpening:2097.89,bank:1476.32,bankDate:'2026-09-30',savings:1372.02,savingsDate:'2026-01-30',fundOpening:637,fundCalls:551.31,fundSpent:0,budget2026:14700,provisionsCurrent:11024.97,budget2027:9500},owners:[{id:'O1',name:'GALLOIS / GUIFFIER',account:'45000004',cg:356,bata:335,provisions:3891.99},{id:'O2',name:'SCI LCT IMMO',account:'45000005',cg:295,bata:291,provisions:3320.46},{id:'O3',name:'PAREL Emmanuelle',account:'45000003',cg:349,bata:328,provisions:3812.52}],expenses:[['2026-01-01','Assureur','Assurance annuelle','Assurance','CG',1400.40,'Justifié'],['2026-02-09','Fournisseur fioul','Livraison 3 000 litres','Chauffage','BATA',3717.18,'Justifié'],['2026-09-30','EDF','Factures janvier à septembre','Électricité','CG',157.46,'Partiel'],['2026-09-30','Service des eaux','Prélèvements avril et septembre','Eau','CG',327.73,'Factures manquantes'],['2026-09-30','TotalEnergies Proxi Sud Est','Maintenance janvier à septembre','Entretien courant','CG',197.98,'Partiel'],['2026-07-10','IRIA Immobilier','Honoraires janvier au 10 juillet','Honoraires syndic','CG',2107.51,'Justifié'],['2026-09-30','Banque','Frais bancaires identifiés','Frais bancaires','CG',26.82,'Partiel']].map((x,i)=>({id:'E'+i,date:x[0],supplier:x[1],label:x[2],cat:x[3],key:x[4],amount:x[5],status:x[6]})),exceptional:[{id:'X1',title:'DPE collectif / PPPT',called:1500,received:1500,spent:1500,status:'Rapproché'},{id:'X2',title:'Acompte audit',called:450,received:289.80,spent:450,status:'Partiel'},{id:'X3',title:'Acompte AMO',called:900,received:579.60,spent:900,status:'Partiel'},{id:'X4',title:'Maîtrise d’œuvre',called:2904,received:1870.18,spent:1953.27,status:'Partiel'},{id:'X5',title:'Solde audit',called:0,received:0,spent:1050,status:'À affecter'}],movements:[{id:'M1',ownerId:'O1',kind:'exceptional-call',label:'DPE / PPPT',amount:534,status:'Réglé'},{id:'M2',ownerId:'O2',kind:'exceptional-call',label:'DPE / PPPT',amount:442.50,status:'Réglé'},{id:'M3',ownerId:'O3',kind:'exceptional-call',label:'DPE / PPPT',amount:523.50,status:'Réglé'},{id:'M4',ownerId:'O1',kind:'exceptional-call',label:'Études AF-2026-01',amount:1514.42,status:'Non réglé'},{id:'M5',ownerId:'O2',kind:'exceptional-call',label:'Études AF-2026-01',amount:1254.93,status:'Réglé'},{id:'M6',ownerId:'O3',kind:'exceptional-call',label:'Études AF-2026-01',amount:1484.65,status:'Réglé'},{id:'M7',ownerId:'O3',kind:'current-payment',label:'Règlement appel courant antérieur',amount:1334.47,status:'Affecté'}],bankTx:[],checklist:['Relevés octobre à décembre','Historique annuel Livret A et intérêts','Balances IRIA','Factures d’eau','Factures maintenance chaudière','EDF octobre à décembre','Vérifier nouvelle livraison de fioul','Charges 2026 reçues début 2027','Rapprochement bancaire définitif','Annexes comptables AG'].map((x,i)=>({id:'C'+i,title:x,done:false})),docs:[]};
function load(){try{const v=localStorage.getItem(KEY);if(v)return merge(JSON.parse(v));const old=localStorage.getItem(V6);if(old){const o=JSON.parse(old),n=structuredClone(seed);if(o.expenses)n.expenses=o.expenses;if(o.owners)n.owners=o.owners.map((x,i)=>({...n.owners[i],...x,provisions:n.owners[i]?.provisions||0}));if(o.exceptional)n.exceptional=o.exceptional;if(o.ownerMovements)n.movements=o.ownerMovements;return n}return structuredClone(seed)}catch(e){return structuredClone(seed)}}function merge(x){return {...structuredClone(seed),...x,settings:{...seed.settings,...(x.settings||{})}}}let S=load();function save(t='Enregistré'){S.meta.updated=today();localStorage.setItem(KEY,JSON.stringify(S));render();toast(t)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}function pill(s){let c=['Justifié','Rapproché','Réglé','Affecté','Terminé'].includes(s)?'ok':['Partiel','À affecter','Factures manquantes'].includes(s)?'warn':['Non réglé','À faire'].includes(s)?'ko':'blue';return `<span class="pill ${c}">${esc(s)}</span>`}function currentTotal(){return sum(S.expenses,x=>x.amount)}function cgTotal(){return sum(S.expenses,x=>x.key==='CG'?x.amount:0)}function batTotal(){return sum(S.expenses,x=>x.key==='BATA'?x.amount:0)}function fundTotal(){return S.settings.fundOpening+S.settings.fundCalls-S.settings.fundSpent}function owner(id){return S.owners.find(x=>x.id===id)}function calcClose(){const cg=cgTotal(),bat=batTotal();return S.owners.map(o=>{const qcg=round(cg*o.cg/1000),qbat=round(bat*o.bata/954),real=round(qcg+qbat),reg=round(real-o.provisions);return {...o,qcg,qbat,real,reg}})}function bankSigned(t){return t.direction==='credit'?Number(t.amount||0):-Number(t.amount||0)}function bankCalculated(){return round(Number(S.settings.bankOpening||0)+sum(S.bankTx||[],bankSigned))}function bankDifference(){return round(Number(S.settings.bank||0)-bankCalculated())}function bankPointed(){return (S.bankTx||[]).filter(x=>x.pointed).length}
function buildNav(){const n=[['home','⌂','Accueil'],['expenses','€','Charges'],['owners','♙','Copro.'],['closing','✓','Clôture'],['more','☰','Plus']];$('nav').innerHTML=n.map((x,i)=>`<button class="nav ${i?'':'active'}" onclick="go('${x[0]}',this)"><b>${x[1]}</b>${x[2]}</button>`).join('');$('drawer').innerHTML=[['bank','Rapprochement bancaire'],['works','Travaux'],['calls','Appels 2027'],['docs','Documents'],['settings','Paramètres']].map(x=>`<button class="secondary" onclick="go('${x[0]}');toggle(false)">${x[1]}</button>`).join('')}function go(id,b){if(id==='more'){toggle();return}document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');toggle(false);render()}function toggle(f){$('drawer').classList.toggle('open',f===undefined?!$('drawer').classList.contains('open'):f)}function render(){home();expenses();owners();closing();bank();works();calls();docs();settings()}
function home(){const c=calcClose(),reg=sum(c,x=>x.reg),done=S.checklist.filter(x=>x.done).length;$('home').innerHTML=`<div class="grid g4"><div class="card kpi"><div class="ico">🏦</div><div><div class="metric">${EUR.format(S.settings.bank)}</div><div class="tiny muted">Compte courant</div></div></div><div class="card kpi"><div class="ico">💰</div><div><div class="metric">${EUR.format(S.settings.savings)}</div><div class="tiny muted">Livret A</div></div></div><div class="card kpi"><div class="ico">🧾</div><div><div class="metric">${EUR.format(currentTotal())}</div><div class="tiny muted">Charges documentées</div></div></div><div class="card kpi"><div class="ico">⚖️</div><div><div class="metric">${EUR.format(reg)}</div><div class="tiny muted">Régularisation provisoire</div></div></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h2>Clôture automatique</h2><div class="row"><span>Charges générales</span><b>${EUR.format(cgTotal())}</b></div><div class="row"><span>Charges BAT A</span><b>${EUR.format(batTotal())}</b></div><div class="row"><span>Provisions appelées</span><b>${EUR.format(sum(S.owners,x=>x.provisions))}</b></div><div class="alert" style="margin-top:10px">Calcul actuel provisoire. Les dépenses d’octobre à décembre et les charges 2026 reçues en 2027 restent à intégrer.</div><div class="actions" style="margin-top:10px"><button onclick="go('closing')">Voir la régularisation</button></div></div><div class="card"><h2>Avancement</h2><div class="row"><span>Checklist</span><b>${done}/${S.checklist.length}</b></div><div class="bar" style="margin:10px 0"><i style="width:${done/S.checklist.length*100}%"></i></div><div class="notice">Fonds travaux comptable : <b>${EUR.format(fundTotal())}</b>. Le fonds travaux reste exclu de la régularisation courante.</div></div></div>`}
function expenses(){ $('expenses').innerHTML=`<div class="card"><h2>Ajouter une charge courante 2026</h2><form class="form" onsubmit="addExpense(event)"><input class="s2" type="date" name="date" value="${today()}" required><input class="s3" name="supplier" placeholder="Fournisseur" required><input class="s3" name="label" placeholder="Libellé" required><select class="s2" name="cat"><option>Assurance</option><option>Chauffage</option><option>Eau</option><option>Électricité</option><option>Entretien courant</option><option>Frais bancaires</option><option>Honoraires syndic</option><option>Autres charges</option></select><select class="s2" name="key"><option value="CG">Générale 1 000</option><option value="BATA">BAT A 954</option></select><input class="s2" type="number" step="0.01" min="0" name="amount" placeholder="Montant" required><select class="s2" name="status"><option>Justifié</option><option>Partiel</option><option>Factures manquantes</option></select><button class="s12">Ajouter et recalculer</button></form></div><div class="card" style="margin-top:12px"><h2>Charges saisies</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Fournisseur</th><th>Libellé</th><th>Clé</th><th class="num">Montant</th><th>Statut</th><th></th></tr></thead><tbody>${S.expenses.map(e=>`<tr><td>${e.date}</td><td>${esc(e.supplier)}</td><td>${esc(e.label)}</td><td>${e.key==='CG'?'CG 1 000':'BAT A 954'}</td><td class="num">${EUR.format(e.amount)}</td><td>${pill(e.status)}</td><td><button class="danger small" onclick="delExpense('${e.id}')">×</button></td></tr>`).join('')}</tbody></table></div></div>`}function addExpense(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));S.expenses.push({id:uid(),...f,amount:Number(f.amount)});save('Charge ajoutée et clôture recalculée')}function delExpense(id){if(confirm('Supprimer cette charge ?')){S.expenses=S.expenses.filter(x=>x.id!==id);save('Charge supprimée')}}
function owners(){const c=calcClose();$('owners').innerHTML=`<div class="grid g3">${c.map(o=>`<div class="card"><h2>${esc(o.name)}</h2><div class="tiny muted">${o.cg}/1 000 · ${o.bata}/954</div><div class="mini-grid" style="margin-top:10px"><div class="mini"><span>Charges réelles</span><b>${EUR.format(o.real)}</b></div><div class="mini"><span>Provisions</span><b>${EUR.format(o.provisions)}</b></div></div><div class="metric ${o.reg>0?'result-positive':o.reg<0?'result-negative':'result-zero'}" style="margin-top:10px">${EUR.format(Math.abs(o.reg))}</div><div class="tiny muted">${o.reg>0?'Complément provisoire à appeler':o.reg<0?'Crédit provisoire à restituer / imputer':'Compte soldé'}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><h2>Ajuster les provisions courantes appelées</h2><form class="form" onsubmit="saveProvisions(event)">${S.owners.map((o,i)=>`<label class="s4">${esc(o.name)}<input type="number" step="0.01" name="${o.id}" value="${o.provisions}"></label>`).join('')}<button class="s12">Enregistrer et recalculer</button></form></div>`}function saveProvisions(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.owners.forEach(o=>o.provisions=Number(f[o.id]||0));save('Provisions enregistrées')}
function closing(){const c=calcClose(),totalReg=round(sum(c,x=>x.reg));$('closing').innerHTML=`<div class="grid g4"><div class="card"><div class="tiny muted">Charges générales</div><div class="metric">${EUR.format(cgTotal())}</div></div><div class="card"><div class="tiny muted">Charges BAT A</div><div class="metric">${EUR.format(batTotal())}</div></div><div class="card"><div class="tiny muted">Provisions</div><div class="metric">${EUR.format(sum(S.owners,x=>x.provisions))}</div></div><div class="card"><div class="tiny muted">Solde global</div><div class="metric">${EUR.format(totalReg)}</div></div></div><div class="card" style="margin-top:12px"><h2>Régularisation automatique 2026</h2><div class="table-wrap"><table><thead><tr><th>Copropriétaire</th><th class="num">Quote-part CG</th><th class="num">Quote-part BAT A</th><th class="num">Charges réelles</th><th class="num">Provisions</th><th class="num">Régularisation</th><th>Sens</th></tr></thead><tbody>${c.map(o=>`<tr><td><b>${esc(o.name)}</b><div class="tiny muted">${o.cg}/1000 · ${o.bata}/954</div></td><td class="num">${EUR.format(o.qcg)}</td><td class="num">${EUR.format(o.qbat)}</td><td class="num">${EUR.format(o.real)}</td><td class="num">${EUR.format(o.provisions)}</td><td class="num ${o.reg>0?'result-positive':o.reg<0?'result-negative':'result-zero'}">${EUR.format(o.reg)}</td><td>${o.reg>0?'À appeler':o.reg<0?'À restituer / imputer':'Soldé'}</td></tr>`).join('')}<tr><th>TOTAL</th><th class="num">${EUR.format(cgTotal())}</th><th class="num">${EUR.format(batTotal())}</th><th class="num">${EUR.format(currentTotal())}</th><th class="num">${EUR.format(sum(S.owners,x=>x.provisions))}</th><th class="num">${EUR.format(totalReg)}</th><th></th></tr></tbody></table></div><div class="actions" style="margin-top:10px"><button onclick="exportClosingCSV()">Exporter la régularisation CSV</button><button class="secondary" onclick="createClosingDoc()">Créer la note d’AG</button></div></div><div class="card" style="margin-top:12px"><h2>Checklist avant validation définitive</h2><div class="stack">${S.checklist.map(x=>`<div class="item check"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCheck('${x.id}',this.checked)"><div>${esc(x.title)}</div>${pill(x.done?'Terminé':'À faire')}</div>`).join('')}</div></div><div class="alert" style="margin-top:12px"><b>Verrou de prudence :</b> le calcul devient définitif uniquement après saisie de toutes les charges rattachées à 2026, rapprochement des comptes bancaires et approbation des comptes par l’assemblée générale.</div>`}function toggleCheck(id,v){S.checklist.find(x=>x.id===id).done=v;save('Checklist mise à jour')}function exportClosingCSV(){const c=calcClose(),rows=[['Copropriétaire','CG','BAT A','Charges réelles','Provisions','Régularisation','Sens'],...c.map(o=>[o.name,o.qcg,o.qbat,o.real,o.provisions,o.reg,o.reg>0?'À appeler':o.reg<0?'À restituer / imputer':'Soldé'])];const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'regularisation-2026.csv');toast('CSV de régularisation créé')}function createClosingDoc(){const c=calcClose();S.docs.unshift({id:uid(),date:today(),title:'Note de clôture automatique 2026',content:`Charges générales : ${EUR.format(cgTotal())}\nCharges BAT A : ${EUR.format(batTotal())}\nCharges totales : ${EUR.format(currentTotal())}\nProvisions courantes : ${EUR.format(sum(S.owners,x=>x.provisions))}\n\nRégularisation provisoire :\n${c.map(o=>`${o.name} : ${EUR.format(o.reg)} - ${o.reg>0?'à appeler':o.reg<0?'à restituer / imputer':'soldé'}`).join('\n')}\n\nCalcul provisoire à valider après clôture et approbation des comptes.`});save('Note de clôture créée');go('docs')}
function bank(){const tx=(S.bankTx||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),calc=bankCalculated(),diff=bankDifference(),pointed=bankPointed();$('bank').innerHTML=`<div class="grid g4"><div class="card"><div class="tiny muted">Solde d’ouverture</div><div class="metric">${EUR.format(S.settings.bankOpening||0)}</div><div class="tiny muted">Au 31/12/2025</div></div><div class="card"><div class="tiny muted">Solde calculé</div><div class="metric">${EUR.format(calc)}</div><div class="tiny muted">Ouverture + mouvements saisis</div></div><div class="card"><div class="tiny muted">Solde du relevé</div><div class="metric">${EUR.format(S.settings.bank)}</div><div class="tiny muted">Au ${String(S.settings.bankDate).split('-').reverse().join('/')}</div></div><div class="card"><div class="tiny muted">Écart à justifier</div><div class="metric ${Math.abs(diff)<0.005?'result-zero':'result-positive'}">${EUR.format(diff)}</div><div class="tiny muted">${pointed}/${tx.length} mouvements pointés</div></div></div><div class="card" style="margin-top:12px"><h2>Ajouter un mouvement bancaire</h2><form class="form" onsubmit="addBankTx(event)"><input class="s2" type="date" name="date" value="${today()}" required><select class="s2" name="direction"><option value="debit">Débit</option><option value="credit">Crédit</option></select><input class="s3" name="label" placeholder="Libellé bancaire" required><input class="s2" type="number" min="0" step="0.01" name="amount" placeholder="Montant" required><select class="s3" name="nature"><option>Charge courante</option><option>Règlement copropriétaire</option><option>Dépense exceptionnelle</option><option>Virement interne Livret A</option><option>Frais bancaires</option><option>Autre</option></select><input class="s3" name="reference" placeholder="Référence / facture"><label class="s2"><input style="width:auto" type="checkbox" name="pointed"> Pointé</label><button class="s12">Ajouter au rapprochement</button></form></div><div class="card" style="margin-top:12px"><div class="row"><h2>Mouvements saisis</h2><div class="actions"><button class="secondary small" onclick="pointAllBank()">Tout pointer</button><button class="secondary small" onclick="exportBankCSV()">Exporter CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Pointé</th><th>Date</th><th>Libellé</th><th>Nature</th><th>Référence</th><th class="num">Débit</th><th class="num">Crédit</th><th></th></tr></thead><tbody>${tx.map(t=>`<tr><td><input style="width:auto" type="checkbox" ${t.pointed?'checked':''} onchange="toggleBankPoint('${t.id}',this.checked)"></td><td>${t.date}</td><td>${esc(t.label)}</td><td>${esc(t.nature)}</td><td>${esc(t.reference||'')}</td><td class="num">${t.direction==='debit'?EUR.format(t.amount):''}</td><td class="num">${t.direction==='credit'?EUR.format(t.amount):''}</td><td><button class="danger small" onclick="delBankTx('${t.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="8">Aucun mouvement saisi. Ajoute les lignes des relevés bancaires pour reconstituer le solde.</td></tr>'}</tbody></table></div></div><div class="${Math.abs(diff)<0.005?'notice':'alert'}" style="margin-top:12px"><b>${Math.abs(diff)<0.005?'Rapprochement équilibré':'Rapprochement incomplet'}</b><br>${Math.abs(diff)<0.005?'Le solde calculé correspond au relevé bancaire.':'Il reste '+EUR.format(Math.abs(diff))+' à expliquer. Vérifie les mois manquants, les virements internes, les frais et les encaissements non saisis.'}</div>`}function addBankTx(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.bankTx=S.bankTx||[];S.bankTx.push({id:uid(),...f,amount:Number(f.amount),pointed:f.pointed==='on'});save('Mouvement bancaire ajouté')}function toggleBankPoint(id,v){const t=S.bankTx.find(x=>x.id===id);if(t)t.pointed=v;save('Pointage mis à jour')}function pointAllBank(){(S.bankTx||[]).forEach(x=>x.pointed=true);save('Tous les mouvements sont pointés')}function delBankTx(id){if(confirm('Supprimer ce mouvement bancaire ?')){S.bankTx=S.bankTx.filter(x=>x.id!==id);save('Mouvement supprimé')}}function exportBankCSV(){const rows=[['Date','Sens','Libellé','Nature','Référence','Montant','Pointé'],...(S.bankTx||[]).map(t=>[t.date,t.direction,t.label,t.nature,t.reference||'',t.amount,t.pointed?'Oui':'Non'])];const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'rapprochement-bancaire-2026.csv');toast('Rapprochement CSV créé')}function works(){ $('works').innerHTML=`<div class="card"><h2>Opérations exceptionnelles</h2><div class="table-wrap"><table><thead><tr><th>Opération</th><th class="num">Appelé</th><th class="num">Encaissé</th><th class="num">Dépensé</th><th class="num">Solde</th><th>Statut</th></tr></thead><tbody>${S.exceptional.map(x=>`<tr><td>${esc(x.title)}</td><td class="num">${EUR.format(x.called)}</td><td class="num">${EUR.format(x.received)}</td><td class="num">${EUR.format(x.spent)}</td><td class="num">${EUR.format(x.received-x.spent)}</td><td>${pill(x.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function calls(){const quarters=['01/01/2027','01/04/2027','01/07/2027','01/10/2027'];$('calls').innerHTML=`<div class="card"><h2>Appels 2027 · budget 9 500 €</h2><div class="notice">Chaque trimestre : 780 € en charges générales et 1 595 € sur la clé BAT A, soit 2 375 € collectifs.</div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Échéance</th>${S.owners.map(o=>`<th class="num">${esc(o.name)}</th>`).join('')}<th class="num">Total arrondi</th></tr></thead><tbody>${quarters.map(d=>{const vals=S.owners.map(o=>round(780*o.cg/1000+1595*o.bata/954));return `<tr><td>${d}</td>${vals.map(v=>`<td class="num">${EUR.format(v)}</td>`).join('')}<td class="num">${EUR.format(sum(vals))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function docs(){ $('docs').innerHTML=`<div class="card"><h2>Documents générés dans l’application</h2><div class="stack">${S.docs.map(d=>`<div class="item"><div class="row"><div><b>${esc(d.title)}</b><div class="tiny muted">${d.date}</div></div><button class="danger small" onclick="delDoc('${d.id}')">×</button></div><div style="white-space:pre-wrap;margin-top:8px">${esc(d.content)}</div></div>`).join('')||'<div class="notice">Aucun document généré.</div>'}</div></div>`}function delDoc(id){S.docs=S.docs.filter(x=>x.id!==id);save('Document supprimé')}
function settings(){const legacy=!!localStorage.getItem(V6)||!!localStorage.getItem(V42);$('settings').innerHTML=`<div class="card"><h2>Paramètres</h2><form class="form" onsubmit="saveSettings(event)"><label class="s3">Solde ouverture 31/12/2025<input type="number" step="0.01" name="bankOpening" value="${S.settings.bankOpening}"></label><label class="s3">Compte courant<input type="number" step="0.01" name="bank" value="${S.settings.bank}"></label><label class="s3">Date compte<input type="date" name="bankDate" value="${S.settings.bankDate}"></label><label class="s3">Livret A<input type="number" step="0.01" name="savings" value="${S.settings.savings}"></label><label class="s3">Date Livret<input type="date" name="savingsDate" value="${S.settings.savingsDate}"></label><label class="s3">Fonds travaux ouverture<input type="number" step="0.01" name="fundOpening" value="${S.settings.fundOpening}"></label><label class="s3">Fonds travaux appelé<input type="number" step="0.01" name="fundCalls" value="${S.settings.fundCalls}"></label><button class="s12">Enregistrer</button></form></div><div class="card" style="margin-top:12px"><h2>Sauvegarde</h2><div class="actions"><button onclick="exportJSON()">Exporter JSON V6.1</button><label class="chip">Importer JSON<input class="hide" type="file" accept="application/json" onchange="importJSON(event)"></label>${legacy?'<button class="secondary" onclick="importPrevious()">Importer une version locale précédente</button>':''}<button class="danger" onclick="resetData()">Réinitialiser</button></div></div>`}function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));['bankOpening','bank','savings','fundOpening','fundCalls'].forEach(k=>f[k]=Number(f[k]||0));S.settings={...S.settings,...f};save('Paramètres mis à jour')}
function importPrevious(){try{const raw=localStorage.getItem(V6)||localStorage.getItem(V42);if(!raw)return;const old=JSON.parse(raw),data=old.data||old;if(data.expenses)S.expenses=data.expenses;if(data.docs)S.docs=data.docs;if(data.ownerMovements)S.movements=data.ownerMovements;save('Données compatibles importées')}catch(e){toast('Import impossible')}}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportJSON(){download(new Blob([JSON.stringify({app:'9 Passage Bellevue V6.2',exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),`9-passage-bellevue-v62-${today()}.json`);toast('Sauvegarde créée')}function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);S=merge(x.data||x);save('Sauvegarde restaurée')}catch(err){toast('JSON invalide')}};r.readAsText(f)}function resetData(){if(confirm('Réinitialiser la V6.1 ?')){S=structuredClone(seed);save('Réinitialisé')}}
buildNav();render();</script></body></html>
