function home(){const done=S.checklist.filter(x=>x.status==='Terminé').length,pct=Math.round(done/S.checklist.length*100);$('home').innerHTML=`<div class="grid g4"><div class="card kpi"><div class="ico">🏦</div><div><div class="metric">${EUR.format(S.settings.bankAtDate)}</div><div class="muted tiny">Compte courant au ${S.settings.bankDate.split('-').reverse().join('/')}</div></div></div><div class="card kpi"><div class="ico">💰</div><div><div class="metric">${EUR.format(S.settings.savingsAtDate)}</div><div class="muted tiny">Livret A connu</div></div></div><div class="card kpi"><div class="ico">🧱</div><div><div class="metric">${EUR.format(worksFund())}</div><div class="muted tiny">Fonds travaux comptable</div></div></div><div class="card kpi"><div class="ico">⚠️</div><div><div class="metric">${EUR.format(outstanding())}</div><div class="muted tiny">Créances identifiées</div></div></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h2>Progression de la clôture 2026</h2><div class="progress-row"><span>${done} actions terminées sur ${S.checklist.length}</span><b>${pct} %</b></div><div class="bar" style="margin:10px 0"><i style="width:${pct}%"></i></div><div class="stack">${S.checklist.filter(x=>x.status!=='Terminé').slice(0,5).map(x=>`<div class="item row"><div><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.area)}</div></div>${statusPill(x.status)}</div>`).join('')}</div></div><div class="card"><h2>Situation financière connue</h2><div class="mini-grid"><div class="mini"><span>Banque totale connue</span><b>${EUR.format(totalBank())}</b></div><div class="mini"><span>Charges courantes documentées</span><b>${EUR.format(currentSpent())}</b></div><div class="mini"><span>Dépenses exceptionnelles</span><b>${EUR.format(exceptionalSpent())}</b></div><div class="mini"><span>Budget 2027</span><b>${EUR.format(S.settings.budget2027)}</b></div></div><div class="alert" style="margin-top:10px">L’appel exceptionnel GALLOIS / GUIFFIER de 1 514,42 € n’est pas function finance(){const rows=S.budget2026.map(b=>{const actual=sum(S.expenses,e=>e.cat===b.label?e.amount:0);return {...b,actual}});$('finance').innerHTML=`<div class="tabs"><button class="tab active">Budget / réel</button><button class="tab" onclick="go('invoices')">Factures</button><button class="tab" onclick="go('works')">Exceptionnel</button></div><div class="grid g3"><div class="card"><div class="muted tiny">Budget 2026</div><div class="metric">${EUR.format(S.settings.budget2026)}</div></div><div class="card"><div class="muted tiny">Charges documentées</div><div class="metric">${EUR.format(currentSpent())}</div></div><div class="card"><div class="muted tiny">Reste sur provisions appelées</div><div class="metric">${EUR.format(S.settings.currentCalls2026-currentSpent())}</div></div></div><div class="card" style="margin-top:12px"><h2>Budget 2026 et réalisé à date</h2><div class="table-wrap"><table><thead><tr><th>Poste</th><th>Clé</th><th class="num">Budget</th><th class="num">Réalisé</th><th class="num">Écart</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${r.key==='CG'?'Générale 1 000':'BAT A 954'}</td><td class="num">${EUR.format(r.planned)}</td><td class="num">${EUR.format(r.actual)}</td><td class="num">${EUR.format(r.actual-r.planned)}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:12px"><h2>Ajouter une dépense</h2><form class="form" onsubmit="addExpense(event)"><input class="s2" type="date" name="date" value="${today()}" required><input class="s3" name="supplier" placeholder="Fournisseur" required><input class="s4" name="label" placeholder="Libellé" required><input class="s3" name="invoice" placeholder="N° facture"><select class="s3" name="cat">${S.budget2026.map(x=>`<option>${esc(x.label)}</option>`).join('')}</select><select class="s3" name="key"><option value="CG">Générale 1 000</option><option value="BATA">BAT A 954</option></select><input class="s3" type="number" step="0.01" min="0" name="amount" placeholder="Montant" required><select class="s3" name="status"><option>Justifié</option><option>Partiel</option><option>Factures manquantes</option></select><button class="s12">Ajouter</button></form></div>`}
function addExpense(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.expenses.push({id:uid(),...f,amount:Number(f.amount),scope:'current'});save('Dépense ajoutée')}
function owners(){ $('owners').innerHTML=`<div class="grid g3">${S.owners.map(o=>{const ms=S.ownerMovements.filter(m=>m.ownerId===o.id),due=sum(ms,m=>m.kind.includes('call')&&m.status!=='Réglé'?m.amount:0);return `<div class="card"><div class="owner-head"><div><h2>${esc(o.name)}</h2><div class="tiny muted">Compte ${o.account} · Lots ${o.lots}</div></div>${statusPill(due?'Non réglé':'À jour')}</div><div class="mini-grid"><div class="mini"><span>Clé générale</span><b>${o.cg}/1 000</b></div><div class="mini"><span>BAT A</span><b>${o.bata}/954</b></div></div><div class="metric" style="margin-top:10px">${EUR.format(due)}</div><div class="tiny muted">Solde identifié restant dû</div><div class="stack" style="margin-top:10px">${ms.map(m=>`<div class="item"><div class="row"><div><b>${esc(m.label)}</b><div class="tiny muted">${m.date} · ${esc(m.kind)}</div></div><b>${EUR.format(m.amount)}</b></div><div style="margin-top:6px">${statusPill(m.status)}</div></div>`).join('')}</div></div>`}).join('')}</div><div class="card" style="margin-top:12px"><h2>Ajouter un mouvement copropriétaire</h2><form class="form" onsubmit="addOwnerMovement(event)"><select class="s3" name="ownerId">${S.owners.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select><input class="s2" type="date" name="date" value="${today()}"><select class="s3" name="kind"><option value="call-current">Appel courant</option><option value="call-exceptional">Appel exceptionnel</option><option value="payment-current">Règlement courant</option><option value="payment-exceptional">Règlement exceptionnel</option></select><input class="s3" name="label" placeholder="Libellé" required><input class="s2" type="number" step="0.01" name="amount" placeholder="Montant" required><select class="s2" name="status"><option>Non réglé</option><option>Réglé</option><option>Affecté</option></select><button class="s12">Ajouter</button></form></div>`}
function addOwnerMovement(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.ownerMovements.push({id:uid(),...f,amount:Number(f.amount)});save('Mouvement ajouté')}
function calls(){const ownerAmount=(o,c)=>Math.round((c.cg*o.cg/1000+c.bata*o.bata/954)*100)/100;$('calls').innerHTML=`<div class="card"><h2>Échéancier 2027 · budget 9 500 €</h2><div class="notice">Charges générales : 3 120 € par an sur 1 000 tantièmes. Chauffage : 6 380 € par an sur la clé BAT A de 954 tantièmes.</div></div><div class="stack" style="margin-top:12px">${S.calls2027.map(c=>`<div class="card"><div class="row"><div><h2>${c.label}</h2><div class="tiny muted">Exigible le ${c.due.split('-').reverse().join('/')}</div></div><div class="metric">${EUR.format(c.cg+c.bata)}</div></div><div class="table-wrap"><table><thead><tr><th>Copropriétaire</th><th class="num">Charges générales</th><th class="num">BAT A</th><th class="num">Total</th></tr></thead><tbody>${S.owners.map(o=>{const cg=Math.round(c.cg*o.cg/10)/100,ba=Math.round(c.bata*o.bata/9.54)/100;return `<tr><td>${esc(o.name)}</td><td class="num">${EUR.format(cg)}</td><td class="num">${EUR.format(ba)}</td><td class="num"><b>${EUR.format(cg+ba)}</b></td></tr>`}).join('')}</tbody></table></div></div>`).join('')}</div>`}
function closing(){const done=S.checklist.filter(x=>x.status==='Terminé').length;$('closing').innerHTML=`<div class="grid g3"><div class="card"><div class="muted tiny">Progression</div><div class="metric">${Math.round(done/S.checklist.length*100)} %</div></div><div class="card"><div class="muted tiny">Actions terminées</div><div class="metric">${done}/${S.checklist.length}</div></div><div class="card"><div class="muted tiny">Charges à date</div><div class="metric">${EUR.format(currentSpent())}</div></div></div><div class="card" style="margin-top:12px"><h2>Checklist de clôture</h2><div class="stack">${S.checklist.map(c=>`<div class="item check"><input type="checkbox" ${c.status==='Terminé'?'checked':''} onchange="toggleCheck('${c.id}',this.checked)"><div><b>${esc(c.title)}</b><div class="tiny muted">${esc(c.area)}</div></div>${statusPill(c.status)}</div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h2>Contrôles de clôture</h2><div class="stack"><div class="notice">Compte courant : relevés disponibles jusqu’au 30/09/2026. Solde connu : ${EUR.format(S.settings.bankAtDate)}.</div><div class="notice">Livret A : solde connu au 30/01/2026 de ${EUR.format(S.settings.savingsAtDate)}. Relevé annuel et intérêts à récupérer.</div><div class="notice">Fonds travaux comptable : ${EUR.format(worksFund())}. Aucune dépense affectée identifiée.</div><div class="alert">La régularisation individuelle ne doit être calculée qu’après intégration des charges d’octobre à décembre et des factures 2026 reçues début 2027.</div></div></div>`}
function toggleCheck(id,v){const c=S.checklist.find(x=>x.id===id);c.status=v?'Terminé':'À faire';save('Checklist mise à jour')}
function works(){const called=sum(S.exceptional,x=>x.called),received=sum(S.exceptional,x=>x.received),spent=sum(S.exceptional,x=>x.spent);$('works').innerHTML=`<div class="grid g3"><div class="card"><div class="muted tiny">Appelé</div><div class="metric">${EUR.format(called)}</div></div><div class="card"><div class="muted tiny">Encaissé identifié</div><div class="metric">${EUR.format(received)}</div></div><div class="card"><div class="muted tiny">Dépensé justifié</div><div class="metric">${EUR.format(spent)}</div></div></div><div class="card" style="margin-top:12px"><h2>Rénovation énergétique</h2><div class="table-wrap"><table><thead><tr><th>Opération</th><th class="num">Appelé</th><th class="num">Encaissé</th><th class="num">Dépensé</th><th class="num">Solde</th><th>Statut</th></tr></thead><tbody>${S.exceptional.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.supplier)} · ${esc(x.docs)}</div></td><td class="num">${EUR.format(x.called)}</td><td class="num">${EUR.format(x.received)}</td><td class="num">${EUR.format(x.spent)}</td><td class="num">${EUR.format(x.received-x.spent)}</td><td>${statusPill(x.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function invoices(){ $('invoices').innerHTML=`<div class="card"><h2>Registre des charges et factures</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Fournisseur / pièce</th><th>Catégorie</th><th>Clé</th><th class="num">Montant</th><th>Statut</th></tr></thead><tbody>${S.expenses.map(e=>`<tr><td>${e.date}</td><td><b>${esc(e.supplier)}</b><div class="tiny muted">${esc(e.invoice)} · ${esc(e.label)}</div></td><td>${esc(e.cat)}</td><td>${e.key==='CG'?'1 000':'954'}</td><td class="num">${EUR.format(e.amount)}</td><td>${statusPill(e.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function meetings(){ $('meetings').innerHTML=`<div class="card"><h2>Assemblées générales</h2><div class="stack">${S.meetings.map(m=>`<div class="item"><div class="row"><div><b>${esc(m.title)}</b><div class="tiny muted">${m.date}</div></div>${statusPill(m.status)}</div><div class="notice" style="margin-top:8px">${m.agenda.map(esc).join('<br>')}</div></div>`).join('')}</div></div>`}
function docs(){ $('docs').innerHTML=`<div class="card"><h2>Documents et notes</h2><form class="form" onsubmit="addDoc(event)"><input class="s4" name="title" placeholder="Titre" required><select class="s3" name="cat"><option>Comptabilité</option><option>AG</option><option>Travaux</option><option>Banque</option></select><textarea class="s5" name="content" placeholder="Contenu"></textarea><button class="s12">Ajouter</button></form></div><div class="stack" style="margin-top:12px">${S.docs.map(d=>`<div class="card"><div class="row"><div><b>${esc(d.title)}</b><div class="tiny muted">${esc(d.cat)} · ${d.date}</div></div><button class="danger small" onclick="removeDoc('${d.id}')">Supprimer</button></div><div class="doc" style="margin-top:8px">${esc(d.content)}</div></div>`).join('')||'<div class="notice">Aucun document local ajouté.</div>'}</div>`}
function addDoc(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.docs.unshift({id:uid(),date:today(),...f});save('Document ajouté')}
function removeDoc(id){S.docs=S.docs.filter(x=>x.id!==id);save('Document supprimé')}
function settings(){const legacy=!!localStorage.getItem(V42);$('settings').innerHTML=`<div class="card"><h2>Paramètres financiers</h2><form class="form" onsubmit="saveSettings(event)"><input class="s3" type="number" step="0.01" name="bankAtDate" value="${S.settings.bankAtDate}" placeholder="Compte courant"><input class="s3" type="date" name="bankDate" value="${S.settings.bankDate}"><input class="s3" type="number" step="0.01" name="savingsAtDate" value="${S.settings.savingsAtDate}" placeholder="Livret A"><input class="s3" type="date" name="savingsDate" value="${S.settings.savingsDate}"><input class="s3" type="number" step="0.01" name="worksFundOpening" value="${S.settings.worksFundOpening}" placeholder="Fonds travaux ouverture"><input class="s3" type="number" step="0.01" name="worksFundCalls" value="${S.settings.worksFundCalls}" placeholder="Fonds travaux appelé"><button class="s12">Enregistrer</button></form></div><div class="card" style="margin-top:12px"><h2>Sauvegarde et migration</h2><div class="notice">Les données restent dans le navigateur. Exporte un fichier JSON avant toute mise à jour du fichier index.html ou du site GitHub.</div><div class="actions" style="margin-top:10px"><button onclick="exportJSON()">Exporter JSON V6</button><label class="chip">Importer JSON<input class="hide" type="file" accept="application/json" onchange="importJSON(event)"></label>${legacy?'<button class="secondary" onclick="importLegacy()">Importer la V4.2</button>':''}<button class="danger" onclick="resetData()">Réinitialiser</button></div></div>`}
function saveSettings(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));['bankAtDate','savingsAtDate','worksFundOpening','worksFundCalls'].forEach(k=>f[k]=Number(f[k]||0));S.settings={...S.settings,...f};save('Paramètres enregistrés')}
function importLegacy(){try{const old=JSON.parse(localStorage.getItem(V42));if(!old)return toast('Aucune V4.2 détectée');S.meta.legacyImported=today();S.docs.unshift({id:uid(),date:today(),title:'Archive import V4.2',cat:'Migration',content:`Import détecté : ${old.owners?.length||0} copropriétaires, ${old.entries?.length||0} écritures, ${old.docs?.length||0} documents. Les données financières V6 de référence ont été conservées.`});(old.docs||[]).forEach(d=>S.docs.push({...d,id:uid(),cat:'Archive V4.2'}));save('Archives V4.2 importées')}catch(e){toast('Import V4.2 impossible')}}
function exportJSON(){const blob=new Blob([JSON.stringify({app:'9 Passage Bellevue V6',exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`9-passage-bellevue-v6-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde JSON créée')}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);S=migrate(raw.data||raw);save('Sauvegarde restaurée')}catch(e){toast('Fichier JSON invalide')}};r.readAsText(f)}
function resetData(){if(confirm('Réinitialiser la V6 avec les données de référence du 14/10/2026 ?')){S=structuredClone(seed);save('Application réinitialisée')}}
buildNav();render();
</script>
</body></html>
